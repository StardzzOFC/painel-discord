name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17 (necessario para o Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev automake build-essential libltdl-dev

      - name: Instalar buildozer
        run: pip install --upgrade Cython buildozer

      - name: Compilar o APK (aceita as licencas do Android sozinho)
        env:
          # PIP_NO_BINARY obriga o pip a compilar esses pacotes a partir do
          # codigo-fonte (sdist) em vez de baixar a wheel pronta. Sem isso,
          # o pip pega a wheel com extensao em C/Rust, que nao tem versao
          # para Android e nao existe recipe pra ela no python-for-android
          # -> e isso que causava o "ResolutionImpossible" tentando TODAS
          # as versoes do discord.py. Compilando do source, as flags
          # *_NO_EXTENSIONS abaixo forcam a versao pura em Python, que
          # o p4a consegue empacotar sem precisar de recipe.
          PIP_NO_BINARY: "aiohttp,multidict,yarl,frozenlist,propcache,aiosignal"
          AIOHTTP_NO_EXTENSIONS: "1"
          MULTIDICT_NO_EXTENSIONS: "1"
          YARL_NO_EXTENSIONS: "1"
          FROZENLIST_NO_EXTENSIONS: "1"
          PROPCACHE_NO_EXTENSIONS: "1"
        run: |
          set -o pipefail
          # "|| true" no yes evita que o job falhe por causa do erro de
          # "Broken pipe" que o proprio "yes" solta quando o buildozer
          # termina de ler a entrada (mesmo com o build tendo dado certo).
          # Sem isso, o pipefail pegava esse erro do "yes" e marcava o
          # job inteiro como failed, mesmo o APK sendo gerado com sucesso.
          (yes || true) | buildozer -v android debug 2>&1 | tee build.log

      - name: Se der erro, mostrar so a parte importante do log
        if: failure()
        run: |
          echo "===== ULTIMAS 40 LINHAS DO LOG (onde geralmente esta o erro final) ====="
          tail -n 40 build.log
          echo ""
          echo "===== LINHA(S) COM O ERRO FATAL DE VERDADE ====="
          grep -n -E "^# (Command failed|Error)|BUILD FAILED|FAILURE:|Traceback \(most recent call last\)" build.log | tail -n 15

      - name: Disponibilizar o APK pra download
        uses: actions/upload-artifact@v4
        with:
          name: painel-discord-apk
          path: bin/*.apk
